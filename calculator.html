<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculatrice</title>
<style>
  :root{
    --bg:#0f1512; --panel:#17211e; --display:#0b1310;
    --key:#243430; --key-op:#0E6B5C; --key-act:#3a4c47;
    --text:#eaf2ef; --muted:#8aa39b; --accent:#13c39a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#0f1512,#16211d);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--text);
  }
  .calc{
    width:320px; max-width:92vw; background:var(--panel); border-radius:22px;
    padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  .display{
    background:var(--display); border-radius:14px; padding:16px 18px; margin-bottom:14px;
    text-align:right; min-height:96px; display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden;
  }
  .history{color:var(--muted); font-size:15px; min-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .current{font-size:40px; font-weight:600; line-height:1.1; word-break:break-all}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  button{
    border:0; border-radius:14px; padding:18px 0; font-size:20px; font-weight:600;
    color:var(--text); background:var(--key); cursor:pointer; transition:filter .12s, transform .05s;
  }
  button:hover{filter:brightness(1.12)}
  button:active{transform:scale(.96)}
  .op{background:var(--key-op)}
  .act{background:var(--key-act); color:var(--muted)}
  .eq{background:var(--accent); color:#04130e}
  .span2{grid-column:span 2}
</style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="grid">
      <button class="act" data-action="clear">AC</button>
      <button class="act" data-action="sign">±</button>
      <button class="act" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="span2" data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

<script>
(function(){
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let current = '0';   // chaîne affichée
  let previous = null; // nombre précédent
  let op = null;       // opérateur en attente
  let justEvaluated = false;

  const symbols = {'+':'+','-':'−','*':'×','/':'÷'};

  function render(){
    currentEl.textContent = current;
    historyEl.textContent = previous !== null
      ? `${format(previous)} ${op ? symbols[op] : ''}` : '';
  }

  function format(n){
    if(!isFinite(n)) return 'Erreur';
    const r = Math.round((n + Number.EPSILON) * 1e10) / 1e10;
    return String(r);
  }

  function inputNum(d){
    if(justEvaluated){ current='0'; justEvaluated=false; }
    current = current === '0' ? d : current + d;
    render();
  }

  function inputDot(){
    if(justEvaluated){ current='0'; justEvaluated=false; }
    if(!current.includes('.')) current += '.';
    render();
  }

  function setOp(nextOp){
    if(op && previous !== null && !justEvaluated){
      compute();
    } else {
      previous = parseFloat(current);
    }
    op = nextOp;
    justEvaluated = false;
    current = '0';
    render();
  }

  function compute(){
    if(op === null || previous === null) return;
    const a = previous, b = parseFloat(current);
    let res;
    switch(op){
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b === 0 ? NaN : a / b; break;
    }
    current = format(res);
    previous = isFinite(res) ? res : null;
  }

  function equals(){
    if(op === null || previous === null) return;
    compute();
    historyEl.textContent = '';
    op = null; previous = null; justEvaluated = true;
    render();
  }

  function clearAll(){
    current='0'; previous=null; op=null; justEvaluated=false; render();
  }

  function toggleSign(){
    if(current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent(){
    current = format(parseFloat(current) / 100);
    justEvaluated = true;
    render();
  }

  document.querySelector('.grid').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.num !== undefined) inputNum(b.dataset.num);
    else if(b.dataset.op) setOp(b.dataset.op);
    else switch(b.dataset.action){
      case 'dot': inputDot(); break;
      case 'equals': equals(); break;
      case 'clear': clearAll(); break;
      case 'sign': toggleSign(); break;
      case 'percent': percent(); break;
    }
  });

  document.addEventListener('keydown', e=>{
    const k = e.key;
    if(k >= '0' && k <= '9') inputNum(k);
    else if(k === '.' || k === ',') inputDot();
    else if(['+','-','*','/'].includes(k)) setOp(k);
    else if(k === 'Enter' || k === '='){ e.preventDefault(); equals(); }
    else if(k === 'Escape') clearAll();
    else if(k === '%') percent();
    else if(k === 'Backspace'){
      if(!justEvaluated){
        current = current.length > 1 ? current.slice(0,-1) : '0';
        render();
      }
    }
  });

  render();
})();
</script>
</body>
</html>
